name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a new push arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}

    steps:
      - uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Test OSC bridge security
        run: yarn test:bridge

      - name: Lint CSS
        run: yarn lint:css

      - name: Build
        run: |
          echo "Base path: $VITE_BASE_PATH"
          yarn run build
        env:
          VITE_BASE_PATH: /hexatone/
          # Dev-branch Pages preview only; not enabled by a normal production build.
          VITE_AUDIO_DIAGNOSTICS: 'true'

      - name: Check build output
        run: |
          ls -la build/
          head -5 build/index.html
          test -s build/supersonic/client/supersonic.js
          test -s build/supersonic/manifest.json
          test -s build/supersonic/synthdefs/hexlab_formant.scsyndef
          test -s build/supersonic/sources/supersonic.tar.gz

      - name: Name Pages artifact
        id: artifact-name
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Re-runs keep earlier artifacts; use a distinct name per attempt.
          name: ${{ steps.artifact-name.outputs.name }}
          path: build

  # A separate job avoids racing the artifact service immediately after upload.
  # Use the build's output name, including when only deployment is re-run.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
