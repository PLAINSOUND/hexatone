<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta
    name="description"
    content="Hexatone user manual rendered in a simple Plainsound-styled reading page."
  />
  <title>Hexatone User Manual</title>
  <link rel="icon" href="./img/192.png" />
</head>
<body>
  <main class="manual-shell">
    <h1 class="manual-brand">USER MANUAL</h1>

    <div class="manual-sidebar">
      <fieldset class="settings-panel settings-panel--manual">
        <legend><b>Manual</b></legend>
        <p id="manual-intro" class="manual-sidebar__intro"></p>
        <div class="manual-sidebar__meta">
          <p id="manual-updated" class="manual-sidebar__updated"></p>
        </div>
      </fieldset>

      <fieldset class="manual-sidebar__panel">
        <legend><b>Sections</b></legend>
        <ol id="manual-toc" class="manual-sidebar__toc"></ol>
      </fieldset>

      <div id="manual-content">
        <p class="manual-status">Loading manual…</p>
      </div>
    </div>
  </main>
  <script type="module" src="/src/manual/usermanual.js"></script>
</body>
</html>
